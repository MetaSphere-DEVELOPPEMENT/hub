set timeout=-1
# Par défaut, l'Aperçu : Entrée pressée par réflexe, ou une touche de télécommande qui
# arrive en Entrée, ne doit jamais lancer l'installation qui efface le disque. Désigné
# par son identifiant, pas par son rang : réordonner les entrées ne le déplace pas.
set default=apercu

# Thème du HUB si le GRUB de la clé sait l'afficher ; sinon, le menu texte suffit.
insmod all_video
insmod gfxterm
insmod png
set hub=/boot/grub/themes/hub
for police in ubuntu-regular-20 ubuntu-regular-24 ubuntu-regular-26 ubuntu-bold-26 ubuntu-bold-64; do
  loadfont $hub/$police.pf2
done
loadfont unicode
set gfxmode=1920x1080,1280x720,auto
set gfxpayload=keep
terminal_output gfxterm
set theme=$hub/theme.txt

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# La clé n'installe rien toute seule : il faut descendre jusqu'à « Installer » et valider.
# Une clé oubliée dans la machine ne doit jamais relancer une installation qui efface le
# disque. L'installation est la dernière entrée : l'avertissement ambre du thème
# (theme.txt) se place juste sous elle, et la classe « efface » lui donne sa pastille.
menuentry "Aperçu du HUB, sans rien installer" --id apercu {
    set gfxpayload=keep
    linux  /casper/vmlinuz  "ds=nocloud;s=/cdrom/nocloud-apercu/" --- quiet splash
    initrd /casper/initrd
}
menuentry "Essayer Ubuntu, sans rien installer" --id essayer {
    set gfxpayload=keep
    linux  /casper/vmlinuz  --- quiet splash
    initrd /casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry "Réglages du micrologiciel UEFI" {
    fwsetup
}
fi
menuentry "Installer le HUB" --id installer --class efface {
    set gfxpayload=keep
    linux  /casper/vmlinuz  autoinstall "ds=nocloud;s=/cdrom/nocloud/" --- quiet splash
    initrd /casper/initrd
}
