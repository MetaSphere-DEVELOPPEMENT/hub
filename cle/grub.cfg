set timeout=-1
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# La clé n'installe rien toute seule : il faut valider ce choix. Une clé oubliée dans
# la machine ne doit jamais relancer une installation qui efface le disque.
menuentry "Installer le HUB — EFFACE le disque interne NVMe" {
    set gfxpayload=keep
    linux  /casper/vmlinuz  autoinstall "ds=nocloud;s=/cdrom/nocloud/" --- quiet splash
    initrd /casper/initrd
}
menuentry "Essayer Ubuntu sans rien installer" {
    set gfxpayload=keep
    linux  /casper/vmlinuz  --- quiet splash
    initrd /casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry "Démarrer sur le disque suivant" {
    exit 1
}
menuentry "Réglages du micrologiciel UEFI" {
    fwsetup
}
fi
