<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HUB</title>
<!--
  Menu d'accueil du HUB, affiché plein écran par hub-menu (WebKitGTK) dans la session
  kiosque. Tout est local : la TV doit démarrer sans réseau.

  Pensé pour être lu à trois mètres et piloté sans souris : flèches, Entrée, Échap,
  une manette, ou une télécommande relayée en touches clavier. La souris marche aussi.

  Le choix remonte à hub-menu par window.webkit.messageHandlers.hub ; ouvert dans un
  navigateur ordinaire pour la mise au point, il s'affiche seulement dans la console.
-->
<style>
:root {
  --encre: #06070c;
  --texte: #f3f5fb;
  --texte-doux: rgba(226, 232, 250, .62);
  --texte-pale: rgba(226, 232, 250, .38);
  --verre: rgba(255, 255, 255, .055);
  --verre-fort: rgba(255, 255, 255, .10);
  --liseré: rgba(255, 255, 255, .13);
  --tv: 62 224 208;
  --jeux: 179 107 255;
  --bureau: 255 181 71;
  --arret: 255 107 107;
  --accent: var(--tv);
  --souple: cubic-bezier(.2, .8, .2, 1);
  --ressort: cubic-bezier(.34, 1.56, .64, 1);
  /* Tout est proportionnel au petit côté de l'écran : le même menu sur la VM en
     1280×800 et sur la TV en 3840×2160. */
  font-size: calc(100vmin / 58);
}

@property --angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

* { box-sizing: border-box; margin: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--encre);
  color: var(--texte);
  font-family: "Ubuntu Sans", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  cursor: none;
  user-select: none;
}
body.souris { cursor: default; }

/* ── Fond ────────────────────────────────────────────────────────────────── */
#aurore {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  /* Dessinée en toute petite résolution puis étirée : le flou est gratuit, et le
     processeur graphique du M720q n'a presque rien à faire, même en 4K. */
  filter: saturate(1.25);
}
.grain {
  position: fixed; inset: 0;
  opacity: .045;
  mix-blend-mode: overlay;
  pointer-events: none;
}
.vignette {
  position: fixed; inset: 0;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(3, 4, 8, .75) 100%),
    linear-gradient(180deg, rgba(3, 4, 8, .35), transparent 22%, transparent 70%, rgba(3, 4, 8, .6));
  pointer-events: none;
}

/* ── Cadre (zone sûre TV : 5 %) ──────────────────────────────────────────── */
.ecran {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: 5vh 5vw;
  transition: opacity .5s var(--souple), transform .6s var(--souple), filter .6s var(--souple);
}
body.depart .ecran { opacity: 0; transform: scale(1.04); filter: blur(12px); }

.entete {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  animation: apparition .9s var(--souple) both;
}
.marque {
  display: flex; align-items: center; gap: .9rem;
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: .5em;
}
.marque i {
  width: 1.1rem; height: 1.1rem;
  border-radius: .35rem;
  background: rgb(var(--accent));
  box-shadow: 0 0 1.4rem rgb(var(--accent) / .9);
  transition: background .6s var(--souple), box-shadow .6s var(--souple);
}
.horloge { text-align: right; font-variant-numeric: tabular-nums; }
.heure {
  font-size: 3.6rem;
  font-weight: 300;
  letter-spacing: -.02em;
  line-height: 1;
}
.date {
  margin-top: .5rem;
  font-size: 1.05rem;
  color: var(--texte-doux);
  text-transform: capitalize;
}

/* ── Accueil ─────────────────────────────────────────────────────────────── */
.centre {
  align-self: center;
  display: grid;
  gap: 2.6rem;
  justify-items: center;
}
.salut {
  text-align: center;
  animation: apparition .9s .08s var(--souple) both;
}
.salut h1 {
  font-size: 2.7rem;
  font-weight: 700;
  letter-spacing: -.025em;
  text-wrap: balance;
}
.salut p {
  margin-top: .45rem;
  font-size: 1.15rem;
  color: var(--texte-doux);
}

.modes {
  display: flex;
  gap: 1.8rem;
  perspective: 90rem;
}

.carte {
  --c: var(--tv);
  position: relative;
  width: 17.5rem;
  height: 21rem;
  padding: 2rem 1.9rem 1.8rem;
  display: flex;
  flex-direction: column;
  border: 0;
  border-radius: 1.9rem;
  color: inherit;
  font: inherit;
  text-align: left;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .02) 55%),
    var(--verre);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  backdrop-filter: blur(28px) saturate(160%);
  box-shadow:
    inset 0 0 0 1px var(--liseré),
    inset 0 1px 0 rgba(255, 255, 255, .16),
    0 1.6rem 3.5rem -1.2rem rgba(0, 0, 0, .6);
  opacity: .72;
  transform: translateY(0) scale(.96);
  transition:
    transform .55s var(--ressort),
    opacity .45s var(--souple),
    box-shadow .45s var(--souple),
    background .45s var(--souple);
  animation: montee .9s var(--souple) both;
  outline: none;
  overflow: hidden;
  isolation: isolate;
}
.carte:nth-child(1) { --c: var(--tv); animation-delay: .14s; }
.carte:nth-child(2) { --c: var(--jeux); animation-delay: .22s; }
.carte:nth-child(3) { --c: var(--bureau); animation-delay: .30s; }

/* Liseré lumineux qui tourne autour de la carte choisie. */
.carte::before {
  content: "";
  position: absolute; inset: 0;
  padding: 2px;
  border-radius: inherit;
  background: conic-gradient(from var(--angle),
    rgb(var(--c) / 0) 0deg, rgb(var(--c)) 70deg, rgb(255 255 255 / .9) 110deg,
    rgb(var(--c) / 0) 180deg, rgb(var(--c) / .55) 260deg, rgb(var(--c) / 0) 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity .45s var(--souple);
  animation: tour 4.5s linear infinite;
  z-index: 2;
}
/* Reflet qui balaie la carte à l'instant où on la choisit. */
.carte::after {
  content: "";
  position: absolute; inset: -40% -60%;
  background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, .22) 50%, transparent 58%);
  transform: translateX(-60%);
  opacity: 0;
  z-index: 1;
  pointer-events: none;
}
.halo {
  position: absolute;
  left: 50%; top: 0;
  width: 24rem; height: 18rem;
  translate: -50% -55%;
  background: radial-gradient(closest-side, rgb(var(--c) / .55), transparent);
  opacity: .18;
  transition: opacity .5s var(--souple);
  z-index: -1;
}

.carte.active {
  opacity: 1;
  transform: translateY(-.9rem) scale(1.06);
  background:
    linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03) 60%),
    var(--verre-fort);
  box-shadow:
    inset 0 0 0 1px rgb(var(--c) / .25),
    inset 0 1px 0 rgba(255, 255, 255, .25),
    0 2.4rem 4.5rem -1rem rgb(var(--c) / .35),
    0 1.6rem 3.5rem -1.2rem rgba(0, 0, 0, .7);
}
.carte.active::before { opacity: 1; }
.carte.active::after { animation: reflet 1.1s .05s var(--souple); }
.carte.active .halo { opacity: .75; }

.pictogramme {
  width: 5.2rem; height: 5.2rem;
  display: grid; place-items: center;
  border-radius: 1.4rem;
  background: linear-gradient(145deg, rgb(var(--c) / .32), rgb(var(--c) / .08));
  box-shadow: inset 0 0 0 1px rgb(var(--c) / .35), 0 .8rem 2rem -.6rem rgb(var(--c) / .5);
  color: rgb(var(--c));
  transition: transform .6s var(--ressort);
}
.pictogramme svg {
  width: 2.8rem; height: 2.8rem;
  fill: none; stroke: currentColor;
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 .5rem rgb(var(--c) / .6));
}
.carte.active .pictogramme { transform: translateY(-.2rem) scale(1.08) rotate(-4deg); }

.nom {
  margin-top: auto;
  font-size: 2.35rem;
  font-weight: 700;
  letter-spacing: -.02em;
}
.detail {
  margin-top: .4rem;
  font-size: 1.05rem;
  line-height: 1.4;
  color: var(--texte-doux);
}
.ouvrir {
  margin-top: 1.3rem;
  display: flex; align-items: center; gap: .6rem;
  font-size: .95rem;
  font-weight: 600;
  letter-spacing: .02em;
  color: rgb(var(--c));
  opacity: 0;
  transform: translateY(.5rem);
  transition: opacity .4s var(--souple), transform .5s var(--souple);
}
.ouvrir kbd { border-color: rgb(var(--c) / .45); color: rgb(var(--c)); }
.carte.active .ouvrir { opacity: 1; transform: none; }

.pastille {
  position: absolute;
  top: 1.7rem; right: 1.6rem;
  padding: .35rem .75rem;
  border-radius: 99rem;
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--texte-doux);
  background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 0 0 1px var(--liseré);
}

/* Lancement : la carte s'avance, le reste s'efface. */
.carte.lance {
  transform: translateY(-.9rem) scale(1.14);
  transition: transform .5s var(--souple);
}
body.depart .carte:not(.lance) { opacity: 0; transform: scale(.9); }

/* ── Pied ────────────────────────────────────────────────────────────────── */
.pied {
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: apparition .9s .38s var(--souple) both;
}
.aides {
  display: flex; gap: 1.8rem;
  font-size: .95rem;
  color: var(--texte-pale);
}
.aides span { display: flex; align-items: center; gap: .55rem; }
kbd {
  min-width: 1.9rem;
  padding: .2rem .5rem;
  border-radius: .45rem;
  font: inherit;
  font-size: .85rem;
  font-weight: 600;
  text-align: center;
  color: var(--texte-doux);
  box-shadow: inset 0 0 0 1px var(--liseré), inset 0 -2px 0 rgba(255, 255, 255, .08);
  background: rgba(255, 255, 255, .04);
}

kbd.fleche { font-family: system-ui, sans-serif; font-size: 1.05rem; line-height: 1.2; }

.bouton-arret {
  --c: var(--arret);
  display: flex; align-items: center; gap: .75rem;
  padding: .85rem 1.4rem .85rem 1.1rem;
  border: 0;
  border-radius: 99rem;
  font: inherit;
  font-size: 1rem;
  font-weight: 600;
  color: var(--texte-doux);
  background: var(--verre);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  box-shadow: inset 0 0 0 1px var(--liseré);
  outline: none;
  transition: color .35s, background .35s, box-shadow .35s, transform .45s var(--ressort);
}
.bouton-arret svg { width: 1.3rem; height: 1.3rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.bouton-arret.active {
  color: var(--texte);
  background: rgb(var(--c) / .18);
  box-shadow: inset 0 0 0 1.5px rgb(var(--c) / .75), 0 0 2.2rem -.3rem rgb(var(--c) / .55);
  transform: scale(1.06);
}

/* ── Confirmation d'arrêt ────────────────────────────────────────────────── */
.voile {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: rgba(4, 5, 10, .45);
  -webkit-backdrop-filter: blur(18px) saturate(120%);
  backdrop-filter: blur(18px) saturate(120%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s var(--souple), visibility 0s .35s;
}
.voile.ouvert { opacity: 1; visibility: visible; transition: opacity .35s var(--souple); }
.dialogue {
  width: 30rem;
  padding: 2.4rem 2.4rem 2rem;
  border-radius: 1.8rem;
  text-align: center;
  background: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
  box-shadow: inset 0 0 0 1px var(--liseré), 0 2.5rem 5rem -1rem rgba(0, 0, 0, .7);
  transform: translateY(1.2rem) scale(.96);
  transition: transform .5s var(--ressort);
}
.voile.ouvert .dialogue { transform: none; }
.dialogue .pictogramme { --c: var(--arret); margin: 0 auto 1.3rem; width: 4.2rem; height: 4.2rem; }
.dialogue .pictogramme svg { width: 2.1rem; height: 2.1rem; }
.dialogue h2 { font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em; }
.dialogue p { margin-top: .5rem; color: var(--texte-doux); font-size: 1.05rem; }
.choix { margin-top: 1.9rem; display: flex; gap: 1rem; }
.choix button {
  flex: 1;
  padding: 1rem;
  border: 0;
  border-radius: 1rem;
  font: inherit;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--texte-doux);
  background: rgba(255, 255, 255, .06);
  box-shadow: inset 0 0 0 1px var(--liseré);
  outline: none;
  transition: all .35s var(--souple);
}
.choix button.active { color: var(--texte); background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .7); transform: scale(1.04); }
.choix button[data-action="eteindre"].active { background: rgb(var(--arret) / .28); box-shadow: inset 0 0 0 1.5px rgb(var(--arret)), 0 0 2rem -.4rem rgb(var(--arret) / .6); }

/* ── Message passager ────────────────────────────────────────────────────── */
.annonce {
  position: fixed;
  left: 50%; bottom: 13vh;
  padding: 1rem 1.6rem;
  border-radius: 99rem;
  font-size: 1.05rem;
  background: rgba(255, 255, 255, .1);
  -webkit-backdrop-filter: blur(24px);
  backdrop-filter: blur(24px);
  box-shadow: inset 0 0 0 1px var(--liseré), 0 1rem 2.5rem -1rem rgba(0, 0, 0, .6);
  opacity: 0;
  transform: translate(-50%, 1rem);
  transition: opacity .35s var(--souple), transform .45s var(--ressort);
}
.annonce.visible { opacity: 1; transform: translate(-50%, 0); }

/* ── Animations ──────────────────────────────────────────────────────────── */
@keyframes apparition { from { opacity: 0; transform: translateY(-.8rem); } }
@keyframes montee { from { opacity: 0; transform: translateY(3rem) scale(.92); } }
@keyframes tour { to { --angle: 360deg; } }
@keyframes reflet {
  0% { opacity: 0; transform: translateX(-60%); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateX(60%); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>
<canvas id="aurore" width="192" height="108"></canvas>
<canvas class="grain" id="grain"></canvas>
<div class="vignette"></div>

<main class="ecran">
  <header class="entete">
    <div class="marque"><i></i>HUB</div>
    <div class="horloge">
      <div class="heure" id="heure">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <section class="centre">
    <div class="salut">
      <h1 id="salut">Bonsoir</h1>
      <p>Que veux-tu lancer ?</p>
    </div>

    <div class="modes" id="modes">
      <button class="carte" data-mode="tv" data-accent="tv">
        <span class="halo"></span>
        <span class="pictogramme">
          <svg viewBox="0 0 32 32"><rect x="3.5" y="6" width="25" height="16.5" rx="2.5"/><path d="M11 27h10M16 22.5V27"/><path d="m14 11.2 5 3-5 3z" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="nom">TV</span>
        <span class="detail">Films, séries et musique avec Kodi</span>
        <span class="ouvrir"><kbd>OK</kbd> Ouvrir</span>
      </button>

      <button class="carte" data-mode="gaming" data-accent="jeux" data-indisponible="Le mode Jeux arrive bientôt : le streaming n'est pas encore configuré.">
        <span class="halo"></span>
        <span class="pastille">Bientôt</span>
        <span class="pictogramme">
          <svg viewBox="0 0 32 32"><path d="M9.5 9h13a6 6 0 0 1 5.9 5l1 5.6a3.4 3.4 0 0 1-6 2.7L21 19.5H11l-2.4 2.8a3.4 3.4 0 0 1-6-2.7l1-5.6A6 6 0 0 1 9.5 9z"/><path d="M10 12.5v4M8 14.5h4"/><circle cx="21" cy="13.4" r=".6" fill="currentColor"/><circle cx="23.4" cy="15.8" r=".6" fill="currentColor"/></svg>
        </span>
        <span class="nom">Jeux</span>
        <span class="detail">Streaming de jeux sur la TV</span>
        <span class="ouvrir"><kbd>OK</kbd> Ouvrir</span>
      </button>

      <button class="carte" data-mode="bureau" data-accent="bureau">
        <span class="halo"></span>
        <span class="pictogramme">
          <svg viewBox="0 0 32 32"><rect x="3.5" y="5" width="25" height="17" rx="2.5"/><path d="M12 27h8M16 22v5"/><path d="M8 10h7M8 13.5h10M8 17h5"/></svg>
        </span>
        <span class="nom">Bureau</span>
        <span class="detail">Ubuntu, pour travailler</span>
        <span class="ouvrir"><kbd>OK</kbd> Ouvrir</span>
      </button>
    </div>
  </section>

  <footer class="pied">
    <div class="aides">
      <span><kbd class="fleche">←</kbd><kbd class="fleche">→</kbd> Choisir</span>
      <span><kbd>OK</kbd> Ouvrir</span>
      <span><kbd class="fleche">↓</kbd> Éteindre</span>
    </div>
    <button class="bouton-arret" id="arret" data-accent="arret">
      <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      Éteindre
    </button>
  </footer>
</main>

<div class="voile" id="voile">
  <div class="dialogue" role="dialog" aria-labelledby="titre-arret">
    <span class="pictogramme"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></span>
    <h2 id="titre-arret">Éteindre le HUB ?</h2>
    <p>La TV restera allumée.</p>
    <div class="choix">
      <button data-action="annuler">Annuler</button>
      <button data-action="eteindre">Éteindre</button>
    </div>
  </div>
</div>

<div class="annonce" id="annonce"></div>

<script>
"use strict";

const COULEURS = {
  tv: [62, 224, 208],
  jeux: [179, 107, 255],
  bureau: [255, 181, 71],
  arret: [255, 107, 107],
};
const doux = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── Horloge et salutation ─────────────────────────────────────────────────
const heure = document.getElementById("heure");
const date = document.getElementById("date");
const salut = document.getElementById("salut");
function horloge() {
  const maintenant = new Date();
  heure.textContent = maintenant.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  date.textContent = maintenant.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const h = maintenant.getHours();
  salut.textContent = h >= 5 && h < 12 ? "Bonjour" : h < 18 && h >= 12 ? "Bon après-midi" : "Bonsoir";
}
horloge();
setInterval(horloge, 5000);

// ── Grain : bruit fixe, calculé une fois ───────────────────────────────────
(function grain() {
  const c = document.getElementById("grain");
  c.width = 256; c.height = 256;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  c.style.backgroundImage = `url(${c.toDataURL()})`;
  c.style.width = "100%"; c.style.height = "100%";
  c.width = 1; c.height = 1;
  c.style.backgroundSize = "256px 256px";
})();

// ── Aurore : des nappes de couleur qui dérivent vers la teinte du mode choisi ─
const aurore = document.getElementById("aurore");
const ctx = aurore.getContext("2d");
const nappes = [
  { x: .18, y: .22, r: .48, vx: .021, vy: .017, phase: 0, teinte: [62, 224, 208] },
  { x: .86, y: .18, r: .42, vx: -.016, vy: .023, phase: 2, teinte: [110, 90, 255] },
  { x: .66, y: .95, r: .5, vx: .013, vy: -.019, phase: 4, teinte: [62, 140, 255] },
  { x: .10, y: .90, r: .50, vx: .019, vy: .011, phase: 1, teinte: [30, 40, 90] },
];
let cible = COULEURS.tv;
let courante = [...COULEURS.tv];

function melange(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }

function dessiner(t) {
  const w = aurore.width, h = aurore.height;
  courante = melange(courante, cible, doux ? 1 : .025);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#06070c";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "lighter";
  nappes.forEach((n, i) => {
    const s = doux ? 0 : t / 1000;
    const x = (n.x + Math.sin(s * n.vx * 6 + n.phase) * .16) * w;
    const y = (n.y + Math.cos(s * n.vy * 6 + n.phase) * .14) * h;
    const r = n.r * w * (1 + Math.sin(s * .3 + n.phase) * .08);
    // La première nappe prend la couleur du mode ; les autres s'en rapprochent un peu.
    const teinte = i === 0 ? courante : melange(n.teinte, courante, .35);
    const force = i === 3 ? .35 : i === 0 ? .34 : .2;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${teinte.map(Math.round).join(",")},${force})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
  if (!doux) requestAnimationFrame(dessiner);
}
requestAnimationFrame(dessiner);

// ── Navigation ────────────────────────────────────────────────────────────
const cartes = [...document.querySelectorAll(".carte")];
const arret = document.getElementById("arret");
const voile = document.getElementById("voile");
const boutonsVoile = [...voile.querySelectorAll("button")];
const annonce = document.getElementById("annonce");
const racine = document.documentElement;

let index = 0;
let surArret = false;
let dialogueOuvert = false;
let indexVoile = 0;
let verrou = false;

const dernier = new URLSearchParams(location.search).get("dernier");
if (dernier) index = Math.max(0, cartes.findIndex(c => c.dataset.mode === dernier));

function accentuer(nom) {
  cible = COULEURS[nom];
  racine.style.setProperty("--accent", COULEURS[nom].join(" "));
}

function afficher() {
  cartes.forEach((c, i) => c.classList.toggle("active", !surArret && i === index));
  arret.classList.toggle("active", surArret);
  accentuer(surArret ? "arret" : cartes[index].dataset.accent);
  boutonsVoile.forEach((b, i) => b.classList.toggle("active", i === indexVoile));
}

let minuterieAnnonce;
function annoncer(texte) {
  annonce.textContent = texte;
  annonce.classList.add("visible");
  clearTimeout(minuterieAnnonce);
  minuterieAnnonce = setTimeout(() => annonce.classList.remove("visible"), 3200);
}

function envoyer(choix) {
  if (window.webkit?.messageHandlers?.hub) window.webkit.messageHandlers.hub.postMessage(choix);
  else console.log("choix :", choix);
}

function lancer() {
  if (verrou) return;
  const carte = cartes[index];
  if (carte.dataset.indisponible) {
    annoncer(carte.dataset.indisponible);
    carte.animate(
      [{ translate: "0" }, { translate: "-.6rem" }, { translate: ".6rem" }, { translate: "-.3rem" }, { translate: "0" }],
      { duration: 420, easing: "ease-out" });
    return;
  }
  verrou = true;
  carte.classList.add("lance");
  document.body.classList.add("depart");
  setTimeout(() => envoyer(carte.dataset.mode), doux ? 0 : 620);
}

function ouvrirDialogue() {
  dialogueOuvert = true;
  indexVoile = 0;
  voile.classList.add("ouvert");
  afficher();
}
function fermerDialogue() {
  dialogueOuvert = false;
  voile.classList.remove("ouvert");
  afficher();
}
function validerDialogue() {
  if (boutonsVoile[indexVoile].dataset.action === "eteindre") {
    verrou = true;
    document.body.classList.add("depart");
    setTimeout(() => envoyer("eteindre"), doux ? 0 : 620);
  } else {
    fermerDialogue();
  }
}

function action(nom) {
  if (verrou) return;
  if (dialogueOuvert) {
    if (nom === "gauche" || nom === "droite") indexVoile = nom === "gauche" ? 0 : 1;
    else if (nom === "ok") return validerDialogue();
    else if (nom === "retour") return fermerDialogue();
    return afficher();
  }
  if (nom === "gauche" && !surArret) index = Math.max(0, index - 1);
  else if (nom === "droite" && !surArret) index = Math.min(cartes.length - 1, index + 1);
  else if (nom === "bas") surArret = true;
  else if (nom === "haut") surArret = false;
  else if (nom === "ok") return surArret ? ouvrirDialogue() : lancer();
  else if (nom === "retour" && surArret) surArret = false;
  afficher();
}

const TOUCHES = {
  ArrowLeft: "gauche", ArrowRight: "droite", ArrowUp: "haut", ArrowDown: "bas",
  Enter: "ok", " ": "ok", Escape: "retour", Backspace: "retour",
};
addEventListener("keydown", e => {
  const nom = TOUCHES[e.key];
  if (!nom) return;
  e.preventDefault();
  document.body.classList.remove("souris");
  action(nom);
});

// Souris : survoler choisit, cliquer ouvre.
addEventListener("mousemove", () => document.body.classList.add("souris"));
cartes.forEach((c, i) => {
  c.addEventListener("mouseenter", () => { if (!dialogueOuvert && !verrou) { index = i; surArret = false; afficher(); } });
  c.addEventListener("click", () => { index = i; surArret = false; lancer(); });
});
arret.addEventListener("mouseenter", () => { if (!dialogueOuvert && !verrou) { surArret = true; afficher(); } });
arret.addEventListener("click", () => { surArret = true; ouvrirDialogue(); });
boutonsVoile.forEach((b, i) => {
  b.addEventListener("mouseenter", () => { indexVoile = i; afficher(); });
  b.addEventListener("click", () => { indexVoile = i; validerDialogue(); });
});

// Manette : croix, stick gauche, A pour ouvrir, B pour revenir.
const pressees = new Set();
function manettes() {
  for (const m of navigator.getGamepads?.() || []) {
    if (!m) continue;
    const etat = {
      haut: m.buttons[12]?.pressed || m.axes[1] < -.6,
      bas: m.buttons[13]?.pressed || m.axes[1] > .6,
      gauche: m.buttons[14]?.pressed || m.axes[0] < -.6,
      droite: m.buttons[15]?.pressed || m.axes[0] > .6,
      ok: m.buttons[0]?.pressed,
      retour: m.buttons[1]?.pressed,
    };
    for (const [nom, appui] of Object.entries(etat)) {
      const cle = m.index + nom;
      if (appui && !pressees.has(cle)) { pressees.add(cle); action(nom); }
      if (!appui) pressees.delete(cle);
    }
  }
  requestAnimationFrame(manettes);
}
requestAnimationFrame(manettes);

afficher();
</script>
</body>
