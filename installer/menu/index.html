<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
<meta charset="utf-8">
<title>HUB</title>
<!--
  Menu d'accueil du HUB, affiché plein écran par hub-menu (WebKitGTK) dans la session
  kiosque. Tout est local : la TV doit démarrer sans réseau (seule la météo en a
  besoin, et elle garde son dernier relevé).

  Piloté sans souris : flèches, Entrée, Échap, raccourcis, manette, voix (hub-voix)
  ou télécommande relayée en touches clavier. La souris marche aussi.

  Ouvert dans un navigateur ordinaire pour la mise au point, il garde ses réglages
  dans localStorage et va chercher la météo lui-même.
-->
<link rel="stylesheet" href="hub.css">
<link rel="stylesheet" href="extensions.css">
</head>
<body>
<canvas id="fond" width="192" height="108"></canvas>
<div id="photos" hidden></div>
<canvas class="grain" id="grain"></canvas>
<div class="vignette"></div>
<div id="intro" hidden><div class="intro-mot"><span>H</span><span>U</span><span>B</span></div><div class="intro-ligne"></div></div>

<main class="ecran" id="accueil">
  <header class="entete">
    <div class="gauche">
      <div class="marque"><i></i>HUB</div>
      <button class="puce" id="puce-profil" data-nav data-action="profils">
        <span class="avatar" id="avatar-profil">P</span>
        <span id="nom-profil">Profil 1</span>
      </button>
    </div>
    <div class="droite">
      <!-- En cours de lecture (Spotify, AirPlay, recopie) : une information, pas un bouton. -->
      <div class="puce lecture-puce" id="lecture" hidden>
        <span class="lecture-pochette" id="lecture-pochette"></span>
        <span class="lecture-textes"><span class="lecture-titre" id="lecture-titre"></span><span class="lecture-detail" id="lecture-detail"></span></span>
        <span class="lecture-ondes" id="lecture-ondes"><i></i><i></i><i></i></span>
      </div>
      <div class="voix-pastille" id="voix-pastille" hidden>
        <svg class="micro" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <span class="ondes"><i></i><i></i><i></i><i></i></span>
        <span id="voix-texte">HUB</span>
      </div>
      <button class="puce meteo-puce" id="puce-meteo" data-nav data-action="meteo" hidden>
        <span id="meteo-picto-puce"></span>
        <span class="temp" id="meteo-temp-puce">--°</span>
        <span class="ville" id="meteo-ville-puce"></span>
      </button>
      <div class="horloge">
        <div class="heure" id="heure">--:--</div>
        <div class="date" id="date"></div>
      </div>
    </div>
  </header>

  <section class="centre">
    <div class="salut">
      <h1 id="salut">Bonsoir</h1>
      <p id="sous-salut"></p>
    </div>

    <div class="modes" id="modes">
      <button class="carte" data-nav data-mode="tv" data-accent="tv">
        <span class="carte-corps">
          <span class="halo"></span>
          <span class="pictogramme">
            <svg viewBox="0 0 32 32"><rect x="3.5" y="6" width="25" height="16.5" rx="2.5"/><path d="M11 27h10M16 22.5V27"/><path d="m14 11.2 5 3-5 3z" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="nom" data-t="mode.tv"></span>
          <span class="detail" data-t="mode.tv.detail"></span>
          <span class="ouvrir"><kbd>OK</kbd> <span data-t="ouvrir"></span></span>
          <span class="touche-rapide">1</span>
        </span>
      </button>

      <button class="carte" data-nav data-mode="gaming" data-accent="jeux">
        <span class="carte-corps">
          <span class="halo"></span>
          <span class="pictogramme">
            <svg viewBox="0 0 32 32"><path d="M9.5 9h13a6 6 0 0 1 5.9 5l1 5.6a3.4 3.4 0 0 1-6 2.7L21 19.5H11l-2.4 2.8a3.4 3.4 0 0 1-6-2.7l1-5.6A6 6 0 0 1 9.5 9z"/><path d="M10 12.5v4M8 14.5h4"/><circle cx="21" cy="13.4" r=".6" fill="currentColor"/><circle cx="23.4" cy="15.8" r=".6" fill="currentColor"/></svg>
          </span>
          <span class="nom" data-t="mode.jeux"></span>
          <span class="detail" data-t="mode.jeux.detail"></span>
          <span class="ouvrir"><kbd>OK</kbd> <span data-t="ouvrir"></span></span>
          <span class="touche-rapide">2</span>
        </span>
      </button>

      <button class="carte" data-nav data-mode="bureau" data-accent="bureau">
        <span class="carte-corps">
          <span class="halo"></span>
          <span class="pictogramme">
            <svg viewBox="0 0 32 32"><rect x="3.5" y="5" width="25" height="17" rx="2.5"/><path d="M12 27h8M16 22v5"/><path d="M8 10h7M8 13.5h10M8 17h5"/></svg>
          </span>
          <span class="nom" data-t="mode.bureau"></span>
          <span class="detail" data-t="mode.bureau.detail"></span>
          <span class="ouvrir"><kbd>OK</kbd> <span data-t="ouvrir"></span></span>
          <span class="touche-rapide">3</span>
        </span>
      </button>
    </div>

    <div class="reprises" id="reprises" hidden>
      <div class="reprises-titre" data-t="reprendre.titre"></div>
      <div class="reprises-liste" id="reprises-liste"></div>
    </div>

    <div class="applis" id="applis" hidden>
      <div class="reprises-titre" data-t="applis.titre"></div>
      <div class="applis-liste" id="applis-liste"></div>
    </div>
  </section>

  <footer class="pied">
    <div class="aides">
      <span><kbd class="fleche">←</kbd><kbd class="fleche">→</kbd> <span data-t="aide.choisir"></span></span>
      <span><kbd>OK</kbd> <span data-t="aide.ouvrir"></span></span>
      <span><kbd>R</kbd> <span data-t="aide.reglages"></span></span>
      <span><kbd>?</kbd> <span data-t="aide.raccourcis"></span></span>
    </div>
    <div class="actions">
      <button class="bouton minuteur" id="bouton-minuteur" data-nav data-action="minuteur" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
        <span id="minuteur-texte"></span>
      </button>
      <button class="bouton rond" data-nav data-action="aide" aria-label="Raccourcis">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h1M10.5 10h1M14.5 10h1M8 14h8"/></svg>
      </button>
      <button class="bouton rond" data-nav data-action="reglages" aria-label="Réglages">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="bouton danger" data-nav data-action="arret">
        <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
        <span data-t="eteindre"></span>
      </button>
    </div>
  </footer>
</main>

<div class="calque" id="profils">
  <div class="profils-corps">
    <h2 data-t="profils.titre"></h2>
    <div class="liste-profils" id="liste-profils"></div>
    <div class="profils-pied">
      <button class="bouton" data-nav data-action="gerer-profils">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span data-t="profils.gerer"></span>
      </button>
    </div>
  </div>
</div>

<div class="calque voile" id="editeur-profil">
  <div class="dialogue editeur">
    <div class="editeur-colonnes">
      <div class="editeur-identite">
        <div class="avatar editeur-apercu" id="editeur-apercu">S</div>
        <h2 id="editeur-titre"></h2>
        <div class="etiquette-champ" data-t="profils.nom"></div>
        <button class="champ" data-nav data-action="editer-nom"><span id="editeur-nom"></span><span class="indice">OK ✎</span></button>
        <div class="etiquette-champ" data-t="profils.couleur"></div>
        <div class="nuancier" id="nuancier"></div>
        <div class="etiquette-champ" data-t="profils.photo"></div>
        <div class="galerie-avatars" id="galerie-avatars"></div>
        <p class="aide-photo" id="aide-photo" data-t="profils.photo.aide"></p>
      </div>
      <div class="editeur-securite">
        <div class="etiquette-champ" data-t="profils.modes"></div>
        <div class="options gauche" id="editeur-modes"></div>
        <p class="aide-photo" id="editeur-restreint" data-t="profils.restreint" hidden></p>
        <p class="aide-photo conseil" id="editeur-conseil" data-t="profils.conseil" hidden></p>
        <div class="etiquette-champ" data-t="profils.code"></div>
        <div class="options gauche" id="editeur-code"></div>
        <div id="editeur-protections"></div>
      </div>
    </div>
    <div class="choix">
      <button class="bouton danger" data-nav data-action="supprimer-profil" id="editeur-supprimer"><span data-t="supprimer"></span></button>
      <button class="bouton" data-nav data-action="fermer"><span data-t="annuler"></span></button>
      <button class="bouton" data-nav data-action="enregistrer-profil"><span data-t="enregistrer"></span></button>
    </div>
  </div>
</div>

<div class="calque voile" id="code">
  <div class="dialogue code-dialogue">
    <div class="avatar editeur-apercu" id="code-avatar"></div>
    <h2 id="code-titre"></h2>
    <p id="code-detail"></p>
    <div class="points" id="code-points"><i></i><i></i><i></i><i></i></div>
    <div class="pave" id="code-pave"></div>
  </div>
</div>

<div class="calque feuille" id="reglages">
  <div class="feuille-corps">
    <nav class="sommaire" id="sommaire">
      <h2 data-t="reglages"></h2>
    </nav>
    <div class="contenu"><div class="contenu-defile" id="contenu-reglages"></div></div>
  </div>
</div>

<div class="calque feuille" id="meteo">
  <div class="feuille-corps simple">
    <div class="contenu"><div class="contenu-defile" id="contenu-meteo"></div></div>
  </div>
</div>

<div class="calque feuille" id="jeux">
  <div class="feuille-corps simple large">
    <div class="contenu"><div class="contenu-defile" id="contenu-jeux"></div></div>
  </div>
</div>

<div class="calque feuille" id="aide">
  <div class="feuille-corps simple">
    <div class="contenu"><div class="contenu-defile" id="contenu-aide"></div></div>
  </div>
</div>

<div class="calque voile" id="arret">
  <div class="dialogue">
    <span class="pictogramme" style="--c: var(--arret)"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></span>
    <h2 data-t="arret.titre"></h2>
    <p data-t="arret.detail"></p>
    <div class="choix">
      <button class="bouton" data-nav data-action="fermer"><span data-t="annuler"></span></button>
      <button class="bouton danger" data-nav data-action="eteindre"><span data-t="eteindre"></span></button>
    </div>
  </div>
</div>

<div class="calque" id="clavier">
  <div class="clavier-corps">
    <div class="saisie"><span class="libelle-saisie" id="libelle-saisie"></span><span id="texte-saisie"></span><i></i></div>
    <div class="touches-clavier" id="touches-clavier"></div>
  </div>
</div>

<div id="ambiant">
  <div class="ambiant-corps" id="ambiant-corps">
    <div class="ambiant-heure" id="ambiant-heure"></div>
    <div class="ambiant-date" id="ambiant-date"></div>
    <div class="ambiant-meteo" id="ambiant-meteo"></div>
    <div class="ambiant-lecture" id="ambiant-lecture" hidden>
      <span class="lecture-pochette" id="ambiant-lecture-pochette"></span>
      <span class="lecture-textes"><span class="lecture-titre" id="ambiant-lecture-titre"></span><span class="lecture-detail" id="ambiant-lecture-detail"></span></span>
    </div>
  </div>
</div>

<div class="bulle-voix" id="bulle-voix"><span class="ondes"><i></i><i></i><i></i><i></i></span><span id="bulle-texte"></span></div>
<div class="annonce" id="annonce"></div>

<script src="i18n.js"></script>
<script src="hub.js"></script>
<!-- Après hub.js : elles s'accrochent à window.hubExtensions. -->
<script src="temps-ecran.js"></script>
<script src="allumage.js"></script>
<script src="cadre.js"></script>
<script src="fluidite.js"></script>
</body>
</html>
